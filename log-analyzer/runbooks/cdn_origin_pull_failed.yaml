id: cdn_origin_pull_failed
name: CDN Origin Pull Failed
description: CDN cannot reach origin — serving stale cache or returning errors to users
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "cdnoriginerror"
  - "origin pull failed"
  - "502 from origin"
  - "serving stale cache"
  - "cdn"
  - "static/js"
  - "static/css"
  - "hero-banner"
steps:
  - "Check if origin server is up and responding — curl the origin directly bypassing CDN"
  - "Check origin server error logs for 502/503 causes (OOM, crash, overload)"
  - "Verify CDN origin configuration has correct hostname and port"
  - "Check if origin security group/firewall allows CDN IP ranges"
  - "If stale cache is serving, assess if it is safe to extend TTL temporarily"
  - "Check if this coincides with a deployment — new assets may not have been deployed to origin"
  - "Purge CDN cache for affected paths once origin is healthy"
routing:
  team: platform
  notify: [slack, email]
observe_threshold:
  count: 3
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 10
