id: feature_flag_timeout
name: Feature Flag Service Timeout
description: Feature flag evaluation failed — flags defaulting to off, affecting rollouts
default_severity: medium
disposition: NEEDS_DEV
patterns:
  - "featureflagtimeout"
  - "feature flag"
  - "failed to evaluate flag"
  - "defaulting to off"
  - "service unreachable"
  - "checkout-v2"
  - "new-pricing-engine"
  - "dark-mode-rollout"
  - "ab-test"
steps:
  - "Check feature flag service (LaunchDarkly, Flagsmith, etc.) status page"
  - "Verify SDK is using local cache/streaming mode — should not make blocking network calls per request"
  - "Check if flag service credentials/API key are still valid"
  - "Confirm fallback defaults are safe — defaulting to off should not break core flows"
  - "If using self-hosted flag service, check its health and resource usage"
  - "Consider switching affected flags to static config temporarily while investigating"
routing:
  team: platform
  notify: [slack]
observe_threshold:
  count: 10
  window_minutes: 5
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 15
