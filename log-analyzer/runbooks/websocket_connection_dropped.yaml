id: websocket_connection_dropped
name: WebSocket Connection Dropped
description: WebSocket connections dropping unexpectedly — real-time features degraded
default_severity: medium
disposition: OBSERVE
patterns:
  - "websocketerror"
  - "connection dropped"
  - "ping timeout"
  - "transport close"
  - "server namespace disconnect"
  - "websocket"
steps:
  - "Check if drops are isolated (single user) or widespread (infrastructure issue)"
  - "Look for load balancer timeout settings — many LBs kill idle WebSocket connections"
  - "Verify WebSocket ping/pong heartbeat is configured and interval is < LB timeout"
  - "Check server memory and CPU — resource pressure causes connection drops"
  - "Review nginx/proxy config for proxy_read_timeout and proxy_send_timeout values"
  - "If widespread, check if a deployment or restart caused mass disconnection"
  - "Add client-side reconnection logic with exponential backoff if not present"
routing:
  team: frontend
  notify: [slack]
observe_threshold:
  count: 20
  window_minutes: 5
  escalate_to: NEEDS_DEV
cooldown_minutes: 10
