id: redis_connection
name: Redis Connection Issues
description: Cache layer connectivity or timeout problems
default_severity: medium
disposition: OBSERVE

patterns:
  - "redis connection failed"
  - "redis timeout"
  - "redis readonly"
  - "connection refused.*6379"

steps:
  - "Check Redis server status and connectivity"
  - "Verify Redis memory usage (maxmemory reached?)"
  - "Check if Redis is in readonly mode (replica promotion?)"
  - "Review Redis slowlog for expensive commands"
  - "Consider cache invalidation if stale data suspected"

routing:
  team: infrastructure
  notify: [email]

observe_threshold:
  count: 15
  window_minutes: 5
  escalate_to: NEEDS_ONCALL

cooldown_minutes: 10
