id: payment_fraud
name: Payment Fraud or Idempotency Violation
description: Fraud detection alert or duplicate charge attempt blocked
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "frauddetectionalert"
  - "risk engine"
  - "score exceeded threshold"
  - "idempotencyviolation"
  - "duplicate payment"
  - "second charge blocked"
steps:
  - "Review the flagged transaction in the payment dashboard"
  - "Verify idempotency keys are being correctly generated and stored"
  - "Check if fraud score threshold needs recalibration"
  - "Notify the compliance team if fraud pattern is sustained"
  - "Ensure refund process is initiated if a double charge occurred"
routing:
  team: payments
  notify: [pagerduty, slack]
observe_threshold:
  count: 3
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 5
