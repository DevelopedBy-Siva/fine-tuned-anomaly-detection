id: token_expired_noise
name: Expected Token Expiry Noise
description: Expired user JWTs are normal session-churn noise and can be auto-suppressed
default_severity: low
disposition: NO_ACTION
patterns:
  - "tokenexpirederror"
  - "jwt expired"
  - "user forced to re-login"
steps:
  - "Confirm the token expiry follows the expected session lifetime"
  - "Check for unusual spikes before changing auth policy"
  - "Leave suppressed unless volume rises above normal user churn"
routing:
  team: auth
  notify: [slack]
observe_threshold:
  count: 25
  window_minutes: 10
  escalate_to: NEEDS_DEV
cooldown_minutes: 30
