id: memory_pressure
name: Memory Pressure Warning
description: Heap growth or GC pressure is rising before an actual OOM kill
default_severity: medium
disposition: OBSERVE
patterns:
  - "memorypressurewarning"
  - "heap at"
  - "gc frequency increasing"
  - "gc pause times"
  - "gc overhead critical"
steps:
  - "Check memory usage trend for the service over the last 30-60 minutes"
  - "Compare memory growth against recent deploys, traffic spikes, or batch jobs"
  - "Capture heap or allocation profiling before restart if growth is sustained"
  - "Review cache growth, queue backlog, and unbounded in-memory collections"
  - "Escalate if pressure continues to climb toward OOM or restart events appear"
routing:
  team: platform
  notify: [slack]
observe_threshold:
  count: 3
  window_minutes: 10
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 10
