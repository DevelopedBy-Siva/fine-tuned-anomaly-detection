id: api_schema_mismatch
name: External API Schema Mismatch
description: Third-party API response shape changed — expected field missing
default_severity: medium
disposition: NEEDS_DEV
patterns:
  - "schemamismatcherror"
  - "api response shape changed"
  - "expected field missing"
  - "salesforce"
  - "hubspot"
  - "shopify"
  - "twilio"
  - "sendgrid"
steps:
  - "Check the external API changelog or status page for breaking changes"
  - "Update the API client to handle the new response shape"
  - "Add response validation with graceful degradation"
  - "Pin API version if versioning is supported"
  - "Add integration tests against the external API contract"
routing:
  team: integrations
  notify: [slack]
observe_threshold:
  count: 5
  window_minutes: 10
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 20
