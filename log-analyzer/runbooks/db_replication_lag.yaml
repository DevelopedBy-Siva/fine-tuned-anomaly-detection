id: db_replication_lag
name: Database Replication Lag
description: Read replica falling behind primary — read consistency degraded
default_severity: medium
disposition: OBSERVE
patterns:
  - "replicationlagwarning"
  - "regex:replica is.*behind primary"
  - "read consistency degraded"
steps:
  - "Check replica server load — may be under-provisioned"
  - "Review write volume — high write throughput causes lag"
  - "Consider routing critical reads to primary temporarily"
  - "Check network bandwidth between primary and replica"
  - "Review replication slot configuration for bloat"
routing:
  team: platform
  notify: [slack]
observe_threshold:
  count: 10
  window_minutes: 10
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 20
