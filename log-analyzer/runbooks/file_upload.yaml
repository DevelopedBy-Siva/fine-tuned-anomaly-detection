id: file_upload
name: File Upload to Object Storage Failed
description: S3 or object storage returning errors on file write
default_severity: medium
disposition: NEEDS_DEV
patterns:
  - "fileuploaderror"
  - "regex:failed to write.*to object storage"
  - "s3 returned 500"
  - "object storage"
  - "file upload failed"
steps:
  - "Check S3/storage service health and bucket permissions"
  - "Verify AWS credentials haven't expired or been rotated"
  - "Check bucket storage quota and lifecycle policies"
  - "Review network connectivity to storage endpoint"
  - "Implement retry with exponential backoff for transient failures"
routing:
  team: backend
  notify: [slack]
observe_threshold:
  count: 10
  window_minutes: 10
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 15
