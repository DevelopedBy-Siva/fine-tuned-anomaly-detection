id: security_alerts
name: Security Attack Detected
description: SQL injection, XSS, or brute force attempts detected and blocked
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "securityalert"
  - "sql injection pattern detected"
  - "xss payload detected"
  - "xss payload"
  - "sanitization applied"
  - "bruteforcedetected"
  - "failed attempts"
  - "ip flagged"
  - "query blocked"
  - "failed attempts on"
  - "brute force"
steps:
  - "Verify the block/sanitization actually worked — no data leaked"
  - "Review WAF rules — consider tightening"
  - "Check if the source IP should be permanently blocked"
  - "Audit recent requests from the flagged IP for earlier probing"
  - "Notify security team if attack appears targeted or sustained"
routing:
  team: security
  notify: [pagerduty, slack]
observe_threshold:
  count: 10
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 10
