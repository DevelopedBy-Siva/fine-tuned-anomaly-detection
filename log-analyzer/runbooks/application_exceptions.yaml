id: application_exceptions
name: Application Runtime Exception
description: NullPointerException, unhandled exceptions, or illegal state errors returning 500
default_severity: high
disposition: NEEDS_DEV
patterns:
  - "nullpointerexception"
  - "unhandledexception"
  - "indexoutofboundsexception"
  - "classcastexception"
  - "illegalstateexception"
  - "concurrentmodificationexception"
  - "numberformatexception"
  - "returned 500"
  - "global handler"
  - "unexpected null reference"
  - "propagated to global handler"
  - "request returned 500"
steps:
  - "Find the stack trace in logs for the exact line and context"
  - "Check if recent deployment introduced the regression"
  - "Reproduce in staging with the same input that caused the error"
  - "Add null guard or input validation at the failure point"
  - "Add test coverage for the edge case"
routing:
  team: backend
  notify: [slack]
observe_threshold:
  count: 5
  window_minutes: 5
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 15
