id: auth_errors
name: Authentication Failures
description: JWT token errors, invalid signatures, or rate limiting on login
default_severity: high
disposition: NEEDS_DEV
patterns:
  - "tokenexpirederror"
  - "invalidsignatureerror"
  - "jwt expired"
  - "jwt signature verification failed"
  - "token tampering"
  - "ratelimitexceeded"
  - "too many login attempts"
  - "authentication failed"
  - "blocked for 15 minutes"
  - "login attempts from"
steps:
  - "Check auth service logs for spike patterns"
  - "Verify JWT secret key hasn't been rotated or leaked"
  - "Review rate limit thresholds — may need tuning"
  - "Check if token expiry settings are too aggressive"
  - "Investigate if brute force is causing rate limit hits"
routing:
  team: security
  notify: [slack, email]
observe_threshold:
  count: 10
  window_minutes: 5
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 15
