id: db_deadlock
name: Database Deadlock
description: Transaction deadlocks causing rollbacks
default_severity: high
disposition: NEEDS_DEV
patterns:
  - "deadlockexception"
  - "transaction deadlock"
  - "deadlock detected"
  - "rolled back"
steps:
  - "Identify which tables and transactions are deadlocking"
  - "Review query execution order — ensure consistent lock ordering"
  - "Check for long-running transactions holding locks"
  - "Add retry logic with exponential backoff for deadlocked transactions"
  - "Consider breaking large transactions into smaller ones"
routing:
  team: backend
  notify: [slack]
observe_threshold:
  count: 5
  window_minutes: 5
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 15
