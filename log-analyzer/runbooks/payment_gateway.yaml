id: payment_gateway
name: Payment Gateway Timeout
description: External payment provider not responding within timeout window
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "paymentgatewaytimeout"
  - "stripe did not respond"
  - "paypal did not respond"
  - "braintree did not respond"
  - "adyen did not respond"
  - "transaction aborted"
steps:
  - "Check payment provider status page (status.stripe.com etc)"
  - "Review timeout configuration — 10s may be too short"
  - "Check if retries are configured with exponential backoff"
  - "Verify network egress to payment provider is healthy"
  - "Consider temporary fallback to secondary payment gateway"
routing:
  team: payments
  notify: [pagerduty, slack]
observe_threshold:
  count: 5
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 10
