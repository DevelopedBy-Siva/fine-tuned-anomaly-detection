id: data_validation
name: Data Validation Failures
description: Input fields failing schema validation — data rejected at API boundary
default_severity: low
disposition: OBSERVE
patterns:
  - "validationerror"
  - "failed schema validation"
  - "data rejected"
  - "regex:field.*failed"
steps:
  - "Check if a client app change is sending malformed data"
  - "Review validation rules — may be too strict for valid inputs"
  - "Check if a third-party integration changed its output format"
  - "Add better error messages to help clients self-diagnose"
  - "Escalate if error rate spikes — may indicate a bad deployment"
routing:
  team: backend
  notify: [email]
observe_threshold:
  count: 20
  window_minutes: 10
  escalate_to: NEEDS_DEV
cooldown_minutes: 30
