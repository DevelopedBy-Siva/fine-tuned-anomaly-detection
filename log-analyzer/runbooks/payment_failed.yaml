id: payment_failed
name: Payment Processing Failures
description: Credit card processing errors including declined cards and duplicate charges
default_severity: high
disposition: NEEDS_DEV
patterns:
  - "payment processing failed"
  - "invalidcardexception"
  - "insufficientfundsexception"
  - "expiredcardexception"
  - "card declined"
  - "carddeclinederror"
  - "payment declined"
  - "insufficient_funds"
  - "card_expired"
  - "do_not_honor"
  - "lost_card"
  - "idempotencyviolation"
  - "duplicate payment request"
  - "second charge blocked"
steps:
  - "Check payment gateway status (Stripe/PayPal dashboard)"
  - "Review error distribution (all cards failing or specific cards?)"
  - "For idempotency violations, check if retry logic is sending duplicate requests"
  - "Verify API keys and credentials are valid"
  - "Check for rate limiting from payment provider"
  - "Review recent payment flow code changes"
routing:
  team: payments
  notify: [email, pagerduty]
observe_threshold:
  count: 5
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 5
