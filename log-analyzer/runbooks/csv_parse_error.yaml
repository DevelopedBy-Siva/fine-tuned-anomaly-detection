id: csv_parse_error
name: CSV Parse Error
description: Malformed CSV rows with unexpected column counts
default_severity: low
disposition: OBSERVE
patterns:
  - "csvparseerror"
  - "malformed row"
  - "unexpected column count"
  - "csv parse"
steps:
  - "Identify the source of the malformed CSV (upload, export, integration)"
  - "Check if delimiter or encoding changed in the file source"
  - "Add row-level error handling to skip bad rows and continue"
  - "Notify the data team or upstream system owner"
  - "Add CSV schema validation before processing"
routing:
  team: data
  notify: [email]
observe_threshold:
  count: 20
  window_minutes: 30
  escalate_to: NEEDS_DEV
cooldown_minutes: 60
