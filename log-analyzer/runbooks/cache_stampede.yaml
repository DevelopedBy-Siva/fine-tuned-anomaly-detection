id: cache_stampede
name: Cache Stampede Detected
description: Simultaneous cache miss storm overwhelming the database
default_severity: high
disposition: NEEDS_DEV
patterns:
  - "cachestampededetected"
  - "cache miss storm"
  - "simultaneous db queries"
  - "cache stampede"
steps:
  - "Implement probabilistic early expiration (PER) to prevent future stampedes"
  - "Add a distributed lock around cache repopulation"
  - "Check database load — may need query throttling immediately"
  - "Pre-warm cache for the affected key"
  - "Consider increasing cache TTL for high-traffic keys"
routing:
  team: backend
  notify: [slack]
observe_threshold:
  count: 3
  window_minutes: 5
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 15
