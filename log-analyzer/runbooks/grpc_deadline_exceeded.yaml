id: grpc_deadline_exceeded
name: gRPC Deadline Exceeded
description: gRPC call timed out — context cancelled by client after deadline
default_severity: high
disposition: NEEDS_DEV
patterns:
  - "deadlineexceeded"
  - "grpc call"
  - "timed out after"
  - "context cancelled"
  - "inventory-grpc"
  - "pricing-grpc"
  - "shipping-grpc"
  - "grpc"
steps:
  - "Identify which gRPC service is timing out and check its health/metrics"
  - "Check if deadline is too tight — compare p99 latency against configured deadline"
  - "Look for upstream bottlenecks causing the downstream gRPC service to be slow"
  - "Verify gRPC server has sufficient resources (CPU, memory, connection pool)"
  - "Consider implementing retry with exponential backoff for idempotent calls"
  - "Add circuit breaker to fail fast instead of waiting for full deadline"
routing:
  team: platform
  notify: [slack]
observe_threshold:
  count: 5
  window_minutes: 10
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 15
