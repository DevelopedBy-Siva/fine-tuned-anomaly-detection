id: idempotency_violation
name: Idempotency / Duplicate Request Violation
description: Duplicate payment or request detected — retry logic firing multiple times
default_severity: high
disposition: NEEDS_DEV
patterns:
  - "idempotencyviolation"
  - "duplicate payment"
  - "duplicate request"
  - "second charge blocked"
  - "idempotency"
  - "double charge"
steps:
  - "Confirm the duplicate was blocked — verify only one charge exists in payment provider dashboard"
  - "Identify the source of the duplicate: client retry, server retry, or network replay"
  - "Check retry logic — ensure retries use the same idempotency key, not a new one each attempt"
  - "Review timeout values — overly aggressive timeouts cause clients to retry before server responds"
  - "Verify idempotency key storage TTL is long enough to cover retry windows"
  - "Check if a deployment caused in-flight requests to be retried"
  - "Add alerting if duplicate rate exceeds 0.1% of transactions — indicates systemic retry issue"
routing:
  team: payments
  notify: [slack]
observe_threshold:
  count: 5
  window_minutes: 10
  escalate_to: NEEDS_ONCALL
cooldown_minutes: 20
