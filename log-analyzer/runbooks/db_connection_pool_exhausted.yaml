id: db_connection_pool_exhausted
name: DB Connection Pool Exhausted
description: All DB connections in use — requests queuing or failing, root cause of cascades
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "connectionpoolexhaustederror"
  - "all connections in use"
  - "pool exhausted"
  - "request queued"
  - "connections in use"
steps:
  - "Check current pool utilization — how many connections are active vs configured max"
  - "Identify long-running queries holding connections: SELECT * FROM pg_stat_activity WHERE state != 'idle'"
  - "Kill blocking queries if safe: SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE duration > interval '30 seconds'"
  - "Check if pool size was recently changed (e.g. deployment config change)"
  - "Increase pool size temporarily if server can handle more connections"
  - "Look for connection leaks — connections not being returned to pool after use"
  - "If this is a cascade root cause, resolve upstream first before pool will drain"
  - "Consider PgBouncer or similar connection pooler if pool exhaustion is recurring"
routing:
  team: backend
  notify: [slack, email]
observe_threshold:
  count: 3
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 10
