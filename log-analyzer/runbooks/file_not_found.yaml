id: file_not_found
name: File Not Found Errors
description: Missing uploaded files or temporary file issues
default_severity: low
disposition: OBSERVE

patterns:
  - "file not found"
  - "/tmp/upload"
  - "no such file or directory"

steps:
  - "Check if file upload service is running"
  - "Verify /tmp directory cleanup job isn't too aggressive"
  - "Review file retention policies"
  - "Check disk space on application servers"
  - "Investigate if files are being processed before deletion"

routing:
  team: backend
  notify: [email]

observe_threshold:
  count: 20
  window_minutes: 10
  escalate_to: NEEDS_DEV

cooldown_minutes: 30
